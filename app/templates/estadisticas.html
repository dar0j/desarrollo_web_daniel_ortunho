<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <style>
        .chart-container {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .chart-div {
            width: 100%;
            height: 400px;
            margin: 20px 0;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .back-link {
            display: block;
            margin: 30px 0;
            text-align: center;
            font-size: 18px;
            color: #0066cc;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #0066cc;
            border-radius: 5px;
            max-width: 200px;
            margin: 30px auto;
        }
        .back-link:hover {
            background-color: #0066cc;
            color: white;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }
        .error {
            text-align: center;
            color: #d32f2f;
            padding: 20px;
            background-color: #ffebee;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #333; margin-bottom: 40px;">Estadísticas de Actividades</h1>
    
    <div class="chart-container">
        <h2>Actividades por día (últimos 30 días)</h2>
        <div id="chart-lineas" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>
    
    <div class="chart-container">
        <h2>Distribución de actividades por tema</h2>
        <div id="chart-torta" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>
    
    <div class="chart-container">
        <h2>Actividades por horario y mes</h2>
        <div id="chart-barras" class="chart-div">
            <div class="loading">Cargando gráfico...</div>
        </div>
    </div>
    
    <a class="back-link" href="{{ url_for('index') }}">← Volver a la portada</a>

    <script>
        Highcharts.setOptions({
            lang: {
                months: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                weekdays: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                shortMonths: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun',
                             'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic']
            }
        });

        function mostrarError(containerId, mensaje) {
            document.getElementById(containerId).innerHTML = 
                `<div class="error">Error al cargar el gráfico: ${mensaje}</div>`;
        }

        async function cargarGraficoLineas() {
            try {
                const response = await fetch('/api/estadisticas/actividades-por-dia');
                const data = await response.json();
                
                if (data.success) {
                    Highcharts.chart('chart-lineas', {
                        chart: {
                            type: 'line'
                        },
                        title: {
                            text: 'Actividades por día'
                        },
                        xAxis: {
                            type: 'datetime',
                            title: {
                                text: 'Fecha'
                            }
                        },
                        yAxis: {
                            title: {
                                text: 'Cantidad de actividades'
                            },
                            min: 0
                        },
                        series: [{
                            name: 'Actividades',
                            data: data.datos,
                            color: '#2196F3'
                        }],
                        credits: {
                            enabled: false
                        }
                    });
                } else {
                    mostrarError('chart-lineas', data.error);
                }
            } catch (error) {
                console.error('Error al cargar gráfico de líneas:', error);
                mostrarError('chart-lineas', 'Error de conexión');
            }
        }

        async function cargarGraficoTorta() {
            try {
                const response = await fetch('/api/estadisticas/actividades-por-tema');
                const data = await response.json();
                
                if (data.success) {
                    Highcharts.chart('chart-torta', {
                        chart: {
                            type: 'pie'
                        },
                        title: {
                            text: 'Distribución por tema'
                        },
                        tooltip: {
                            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b> ({point.y} actividades)'
                        },
                        accessibility: {
                            point: {
                                valueSuffix: '%'
                            }
                        },
                        plotOptions: {
                            pie: {
                                allowPointSelect: true,
                                cursor: 'pointer',
                                dataLabels: {
                                    enabled: true,
                                    format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                                }
                            }
                        },
                        series: [{
                            name: 'Actividades',
                            colorByPoint: true,
                            data: data.datos
                        }],
                        credits: {
                            enabled: false
                        }
                    });
                } else {
                    mostrarError('chart-torta', data.error);
                }
            } catch (error) {
                console.error('Error al cargar gráfico de torta:', error);
                mostrarError('chart-torta', 'Error de conexión');
            }
        }

        async function cargarGraficoBarras() {
            try {
                const response = await fetch('/api/estadisticas/actividades-por-horario-mes');
                const data = await response.json();
                
                if (data.success) {
                    Highcharts.chart('chart-barras', {
                        chart: {
                            type: 'column'
                        },
                        title: {
                            text: 'Actividades por horario y mes'
                        },
                        xAxis: {
                            categories: data.categorias,
                            title: {
                                text: 'Mes'
                            }
                        },
                        yAxis: {
                            min: 0,
                            title: {
                                text: 'Cantidad de actividades'
                            }
                        },
                        tooltip: {
                            headerFormat: '<span style="font-size:10px">{point.key}</span><table>',
                            pointFormat: '<tr><td style="color:{series.color};padding:0">{series.name}: </td>' +
                                '<td style="padding:0"><b>{point.y} actividades</b></td></tr>',
                            footerFormat: '</table>',
                            shared: true,
                            useHTML: true
                        },
                        plotOptions: {
                            column: {
                                pointPadding: 0.2,
                                borderWidth: 0
                            }
                        },
                        series: data.series.map((serie, index) => ({
                            ...serie,
                            color: ['#FF6B6B', '#4ECDC4', '#45B7D1'][index]
                        })),
                        credits: {
                            enabled: false
                        }
                    });
                } else {
                    mostrarError('chart-barras', data.error);
                }
            } catch (error) {
                console.error('Error al cargar gráfico de barras:', error);
                mostrarError('chart-barras', 'Error de conexión');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            cargarGraficoLineas();
            cargarGraficoTorta();
            cargarGraficoBarras();
        });
    </script>
</body>
</html>
